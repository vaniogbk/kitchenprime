# Déploiement Hostinger — déclenchement MANUEL uniquement.
#
# Le déclenchement automatique sur `main` a été retiré tant que l'hébergement
# n'est pas en place : sans les secrets SSH, le job échouait à chaque push et
# affichait un rouge permanent sur la branche principale, ce qui finit par
# faire ignorer les vrais échecs.
#
# Pour le réactiver quand Hostinger sera prêt :
#   1. renseigner les secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH,
#      DEPLOY_SSH_KEY (et DATABASE_URL, NEXTAUTH_SECRET, NEXTAUTH_URL,
#      NEXT_PUBLIC_APP_URL) dans Settings → Secrets and variables → Actions ;
#   2. remettre le bloc `push: branches: [main]` ci-dessous.
name: Deploy to Hostinger

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Échoue tôt et clairement plutôt qu'au milieu du déploiement, une fois
      # le code déjà compilé.
      - name: Vérifier que les secrets de déploiement sont configurés
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            eval "value=\$$name"
            # Un `if` et non `[ … ] && …` : sous `set -e`, une condition fausse
            # ferait échouer l'étape alors que le secret est bien présent.
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing — voir l'en-tête de ce fichier."
            exit 1
          fi
          echo "Tous les secrets de déploiement sont présents."
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://placeholder:placeholder@localhost:3306/placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-only-secret' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
        run: npm run build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync code to server
        run: |
          rsync -avz --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.env' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Build & restart on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && \
            docker compose pull || true && \
            docker compose build app && \
            docker compose up -d && \
            docker compose exec -T app npx prisma db push --accept-data-loss=false || true"
