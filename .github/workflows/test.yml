name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_PORT: '3178'
  # Aucune base n'est jointe en CI : le client Prisma se génère à partir du
  # schéma, mais aucune requête n'est exécutée par les pages pré-rendues.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  NEXTAUTH_SECRET: 'ci-secret-not-used-in-production'

jobs:
  static:
    name: Types, lint et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate

      - name: Le sprite d'icônes est à jour
        # Le fichier est généré : s'il diverge du source, une icône a été
        # ajoutée sans relancer la génération et manquerait en production.
        run: |
          npm run build:icons
          git diff --exit-code components/ui/icons.generated.ts

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test:unit

  e2e:
    name: End-to-end, SEO et performance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate

      - name: Installation du navigateur
        run: npx playwright install --with-deps chromium

      - name: Build de production
        run: npm run build:e2e

      - name: Tests end-to-end, SEO et performance
        run: npm run test:e2e

      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate
      - run: npm run build:e2e

      - name: Audit Lighthouse
        run: npm run test:lighthouse

      - name: Rapports Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-reports/
          retention-days: 14
